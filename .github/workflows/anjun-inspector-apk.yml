name: Build Anjun Inspector APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'anjun-inspector/**'
      - '.github/workflows/anjun-inspector-apk.yml'
permissions:
  contents: read
concurrency:
  group: anjun-inspector-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: anjun-inspector
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'
      - name: Compile installable debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify signature and prepare download
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk"
          mkdir -p dist
          cp "$apk" dist/AnjunAutoInspector-v0.1.1.apk
          cd dist
          sha256sum AnjunAutoInspector-v0.1.1.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AnjunAutoInspector-debug-apk
          path: anjun-inspector/dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_tag="anjun-inspector-v0.1.1-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          cat > "$RUNNER_TEMP/anjun-release-notes.md" <<'NOTES'
          APK Android 8.0+ de observação local da estrutura de telas.
          Versão experimental assinada com chave de debug, compilada pelo GitHub Actions.

          Abra o APK, ative o serviço nas configurações de acessibilidade e navegue manualmente pela Anjun. O relatório contém somente tipos e contagens de elementos.
          Esta versão ainda não inclui painel flutuante, Roteia ou navegação automática. Não realiza baixas nem envia dados.

          A assinatura e a integridade do APK foram verificadas durante a compilação. A operação no aplicativo Anjun instalado precisa ser validada no aparelho.
          NOTES
          gh release create "$release_tag" dist/AnjunAutoInspector-v0.1.1.apk dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Anjun Auto Inspector v0.1.1 (build $GITHUB_RUN_NUMBER)" --notes-file "$RUNNER_TEMP/anjun-release-notes.md" --prerelease
